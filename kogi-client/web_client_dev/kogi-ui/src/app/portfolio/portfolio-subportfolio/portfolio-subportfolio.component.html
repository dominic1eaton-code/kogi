<div class="grid grid-cols-1 gap-4 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)]">
  <section class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[12px] font-semibold font-['JetBrains_Mono']">Subportfolio</div>
    <div class="text-[10px] text-[#5d747c]">Nested portfolio rollups and child component view.</div>
    <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
      <div
        *ngFor="let item of summary"
        class="rounded-[10px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2"
      >
        <div class="text-[9px] uppercase tracking-[0.2em] text-[#5d747c]">{{ item.label }}</div>
        <div class="mt-1 text-[11px] font-semibold text-[#e6f1f4]">{{ item.value }}</div>
      </div>
    </div>
  </section>

  <aside class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[12px] font-semibold font-['JetBrains_Mono']">Child Components</div>
    <div class="text-[10px] text-[#5d747c]">Items within this subportfolio.</div>
    <div class="mt-3 space-y-2">
      <div
        *ngFor="let child of childItems"
        class="flex items-center justify-between rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2 text-[10px]"
      >
        <div>
          <div class="text-[11px] font-semibold">{{ child.name }}</div>
          <div class="text-[9px] text-[#5d747c]">{{ child.type }}</div>
        </div>
        <span class="rounded-[6px] border border-[rgba(16,185,129,0.35)] bg-[rgba(16,185,129,0.12)] px-2 py-[2px] text-[9px] text-[#10b981]">
          {{ child.status }}
        </span>
      </div>
    </div>
  </aside>
</div>
