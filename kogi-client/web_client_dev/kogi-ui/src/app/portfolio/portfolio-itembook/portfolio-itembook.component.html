<div class="space-y-4">
  <section class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[13px] font-semibold font-['JetBrains_Mono']">ItemBook</div>
        <div class="text-[10px] text-[#5d747c]">Per-item dossier: charter, workspace, catalogue, library, logs.</div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="rounded-[6px] border border-[rgba(59,130,246,0.35)] bg-[rgba(59,130,246,0.12)] px-2 py-[2px] text-[9px] font-semibold text-[#60a5fa]">
          Version v2.3
        </span>
        <span class="rounded-[6px] border border-[rgba(16,185,129,0.35)] bg-[rgba(16,185,129,0.12)] px-2 py-[2px] text-[9px] font-semibold text-[#10b981]">
          Active
        </span>
      </div>
    </div>

    <div class="mt-4 flex flex-wrap gap-2 text-[10px] font-['JetBrains_Mono']">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-[#101e24] text-[#e6f1f4]"
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] px-3 py-1 text-[#8ea6ad]"
      >
        {{ item.label }}
      </a>
    </div>
  </section>

  <router-outlet></router-outlet>
</div>
