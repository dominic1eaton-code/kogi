<div class="grid grid-cols-1 gap-4 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)]">
  <section class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[12px] font-semibold font-['JetBrains_Mono']">Metrics</div>
    <div class="text-[10px] text-[#5d747c]">KPIs with targets and tracking.</div>
    <div class="mt-3 space-y-2">
      <div
        *ngFor="let metric of metrics"
        class="flex items-center justify-between rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2 text-[10px]"
      >
        <div>
          <div class="text-[11px] font-semibold">{{ metric.name }}</div>
          <div class="text-[9px] text-[#5d747c]">Target {{ metric.target }}</div>
        </div>
        <div class="text-[11px] font-semibold text-[#10b981]">{{ metric.value }}</div>
      </div>
    </div>
  </section>

  <aside class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[12px] font-semibold font-['JetBrains_Mono']">Scorecards</div>
    <div class="text-[10px] text-[#5d747c]">Model outputs linked to the ItemBook.</div>
    <div class="mt-3 space-y-2">
      <div
        *ngFor="let score of scorecards"
        class="flex items-center justify-between rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2 text-[10px]"
      >
        <span class="text-[#8ea6ad]">{{ score.label }}</span>
        <span class="text-[#e6f1f4]">{{ score.value }}</span>
      </div>
    </div>
  </aside>
</div>
