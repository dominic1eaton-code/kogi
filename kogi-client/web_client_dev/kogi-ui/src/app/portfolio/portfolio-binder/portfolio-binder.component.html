<div class="grid grid-cols-1 gap-4 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)]">
  <section class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[13px] font-semibold font-['JetBrains_Mono']">Platform Binder</div>
    <div class="text-[10px] text-[#5d747c]">Binder view aggregating portfolio components.</div>

    <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
      <div
        *ngFor="let item of binderMeta"
        class="rounded-[10px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2"
      >
        <div class="text-[9px] uppercase tracking-[0.2em] text-[#5d747c]">{{ item.label }}</div>
        <div class="mt-1 text-[11px] font-semibold text-[#e6f1f4]">{{ item.value }}</div>
      </div>
    </div>

    <div class="mt-4 space-y-3">
      <div
        *ngFor="let section of binderSections"
        class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#101e24]"
      >
        <div class="border-b border-[rgba(255,255,255,0.06)] px-3 py-2 text-[10px] font-semibold text-[#5ca0bf]">
          {{ section.title }}
        </div>
        <div class="space-y-2 p-3 text-[10px]">
          <div
            *ngFor="let entry of section.entries"
            class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-2 py-2"
          >
            {{ entry }}
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
    <div class="text-[12px] font-semibold font-['JetBrains_Mono']">Binder Notes</div>
    <div class="text-[10px] text-[#5d747c]">Binder coverage and governance highlights.</div>
    <div class="mt-4 space-y-2 text-[10px]">
      <div
        *ngFor="let note of binderNotes"
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-2 text-[#8ea6ad]"
      >
        {{ note }}
      </div>
    </div>
    <div class="mt-4 rounded-[10px] border border-[rgba(255,255,255,0.06)] bg-[#101e24] px-3 py-3 text-[10px] text-[#8ea6ad]">
      Binder views link directly into ItemBooks, registries, and analytics rollups.
    </div>
  </aside>
</div>
