<div
  class="relative min-h-screen w-full font-['Space_Grotesk'] text-[#e6f1f4]"
  style="
    background-color: #0b1115;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 42px 42px;
  "
>
  <div
    class="pointer-events-none fixed -left-[120px] -top-[150px] h-[500px] w-[500px]"
    style="background: radial-gradient(circle, rgba(16, 185, 129, 0.08), transparent 70%);"
  ></div>
  <div
    class="pointer-events-none fixed -bottom-[120px] -right-[120px] h-[450px] w-[450px]"
    style="background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent 70%);"
  ></div>

  <app-navigation></app-navigation>

  <header
    class="fixed left-0 right-0 top-0 flex h-[56px] items-center gap-3 border-b border-[rgba(255,255,255,0.06)] bg-gradient-to-b from-[#0e1b21] to-[#0b1418] px-5 lg:left-[220px]"
  >
    <h1 class="flex-1 text-[16px] font-bold">Office</h1>
    <div class="flex items-center gap-2 rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-2.5 py-[7px] text-[12px] text-[#8ea6ad]">
      &#8981; Search
    </div>
    <div class="hidden items-center text-[10px] text-[#5d747c] lg:flex">
      <div class="flex items-center gap-1 border-r border-[rgba(255,255,255,0.06)] px-2">
        <span class="font-semibold text-[#e6f1f4]">6</span>
        <span>Projects</span>
      </div>
      <div class="flex items-center gap-1 border-r border-[rgba(255,255,255,0.06)] px-2">
        <span class="font-semibold text-[#e6f1f4]">73%</span>
        <span>Health</span>
      </div>
      <div class="flex items-center gap-1 border-r border-[rgba(255,255,255,0.06)] px-2">
        <span class="font-semibold text-[#e6f1f4]">$4,820</span>
        <span>Wallet</span>
      </div>
      <div class="flex items-center gap-1 px-2">
        <span class="font-semibold text-[#e6f1f4]">62%</span>
        <span>OKR</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button
        class="flex h-[28px] w-[28px] items-center justify-center rounded-[6px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] text-[12px] text-[#8ea6ad]"
        type="button"
      >
        &#9681;
      </button>
      <button
        class="flex h-[28px] w-[28px] items-center justify-center rounded-[6px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] text-[12px] text-[#8ea6ad]"
        type="button"
      >
        ?
      </button>
      <button
        class="rounded-[8px] bg-gradient-to-br from-[#10b981] to-[#059669] px-[14px] py-[8px] text-[12px] font-semibold text-white"
        type="button"
      >
        + New
      </button>
      <button
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-[12px] py-[8px] text-[12px] font-semibold text-[#e6f1f4]"
        type="button"
        (click)="logout()"
      >
        Sign out
      </button>
    </div>
  </header>

  <main class="ml-0 px-5 pb-10 pt-[76px] lg:ml-[220px]">
    <div class="mb-4 h-[2px] w-full rounded bg-gradient-to-r from-[#3b82f6] via-[#a855f7] via-[#ec4899] via-[#f97316] via-[#eab308] via-[#22c55e] to-[#06b6d4]"></div>

    <section
      class="sticky top-[76px] z-30 mb-4 flex flex-wrap items-center justify-between gap-3 rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-[40px] w-[40px] items-center justify-center rounded-[10px] bg-[rgba(16,185,129,0.15)] text-[16px] text-[#10b981]"
        >
          &#9873;
        </div>
        <div>
          <div class="text-[16px] font-semibold">Office</div>
          <div class="text-[9px] font-['JetBrains_Mono'] uppercase tracking-[0.3em] text-[#5d747c]">
            <a
              routerLink="/office/overview"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Overview
            </a>
            <span>&middot;</span>
            <a
              routerLink="/office/inbox"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Inbox
            </a>
            <span>&middot;</span>
            <a
              routerLink="/office/schedule"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Schedule
            </a>
            <span>&middot;</span>
            <a
              routerLink="/office/calendar"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Calendar
            </a>
            <span>&middot;</span>
            <a
              routerLink="/office/studio"
              routerLinkActive="text-[#10b981]"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Studio
            </a>
            <span>&middot;</span>
            <a
              routerLink="/office/contacts"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Contacts
            </a>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input
          class="hidden w-[180px] rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-3 py-[6px] text-[11px] text-[#8ea6ad] placeholder:text-[#5d747c] md:block"
          placeholder="Search office"
          type="text"
        />
        <span
          class="rounded-[6px] border border-[rgba(16,185,129,0.35)] bg-[rgba(16,185,129,0.12)] px-2 py-[4px] text-[10px] font-semibold text-[#10b981]"
          >ACTIVE</span
        >
        <div
          class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-gradient-to-br from-[#f59e0b] to-[#f97316] text-[12px] font-bold text-[#0b1115]"
        >
          J
        </div>
      </div>
    </section>

    <div class="min-w-0">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
