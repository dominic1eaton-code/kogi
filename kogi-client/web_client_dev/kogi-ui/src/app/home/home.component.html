<div
  class="relative min-h-screen w-full overflow-hidden font-['Space_Grotesk'] text-[#e8f2f4]"
  style="
    background-color: #0a1013;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 42px 42px;
  "
>
  <div
    class="pointer-events-none fixed -left-[180px] -top-[160px] h-[460px] w-[460px] rounded-full blur-[40px]"
    style="background: radial-gradient(circle, rgba(16, 185, 129, 0.18), transparent 65%);"
  ></div>
  <div
    class="pointer-events-none fixed -right-[120px] top-[140px] h-[520px] w-[520px] rounded-full blur-[45px]"
    style="background: radial-gradient(circle, rgba(168, 85, 247, 0.16), transparent 70%);"
  ></div>
  <div
    class="pointer-events-none fixed bottom-[-220px] left-[20%] h-[520px] w-[520px] rounded-full blur-[35px]"
    style="background: radial-gradient(circle, rgba(245, 158, 11, 0.16), transparent 70%);"
  ></div>

  <header
    class="sticky top-0 z-40 border-b border-[rgba(255,255,255,0.06)] bg-[rgba(7,12,15,0.78)] backdrop-blur"
  >
    <div class="mx-auto flex w-full max-w-[1200px] items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-3">
        <div
          class="flex h-[34px] w-[34px] items-center justify-center rounded-[9px] bg-gradient-to-br from-[#10b981] to-[#059669] text-sm font-extrabold text-white shadow-[0_6px_25px_rgba(16,185,129,0.35)]"
        >
          K
        </div>
        <span class="text-sm font-semibold tracking-[0.2em] uppercase">kogi</span>
      </div>

      <nav class="hidden items-center gap-6 text-[13px] text-[#9fb2b8] md:flex">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="text-[#fbbf24]"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="transition-colors hover:text-[#e8f2f4]"
        >
          {{ item.label }}
        </a>
      </nav>

      <div class="flex items-center gap-2">
        <a
          routerLink="/login"
          class="hidden rounded-[999px] border border-[rgba(255,255,255,0.08)] px-4 py-2 text-[12px] font-semibold text-[#cbd7db] transition hover:border-[#f59e0b] hover:text-[#f8fafc] md:inline-flex"
        >
          Sign in
        </a>
        <a
          routerLink="/registration"
          class="rounded-[999px] bg-gradient-to-r from-[#10b981] to-[#059669] px-4 py-2 text-[12px] font-semibold text-white shadow-[0_10px_25px_rgba(16,185,129,0.35)] transition hover:-translate-y-[1px]"
        >
          Create account
        </a>
      </div>
    </div>
  </header>

  <main class="relative z-10 px-6 pb-16 pt-10 lg:px-12">
    <router-outlet></router-outlet>
  </main>

  <footer class="relative z-10 border-t border-[rgba(255,255,255,0.06)] px-6 py-10">
    <div class="mx-auto flex w-full max-w-[1200px] flex-col gap-8 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <div class="mb-2 text-[15px] font-semibold">Kogi Platform</div>
        <p class="max-w-[420px] text-[12px] leading-5 text-[#91a6ad]">
          An independent work operating system that unifies portfolios, banking, governance, marketplace,
          and community in one connected workspace.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-4 text-[12px] text-[#9fb2b8]">
        <a class="hover:text-[#fbbf24]" routerLink="/home">Home</a>
        <a class="hover:text-[#fbbf24]" routerLink="/home/about">About</a>
        <a class="hover:text-[#fbbf24]" routerLink="/home/platform">Platform</a>
        <a class="hover:text-[#fbbf24]" routerLink="/home/ecosystem">Ecosystem</a>
        <span class="text-[#52626a]">|</span>
        <a class="hover:text-[#fbbf24]" routerLink="/login">Sign in</a>
      </div>

      <div class="flex items-center gap-3">
        <a
          routerLink="/registration"
          class="rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(12,24,30,0.7)] px-4 py-2 text-[12px] font-semibold text-[#e8f2f4] transition hover:border-[#10b981]"
        >
          Start building
        </a>
        <a
          routerLink="/home/platform"
          class="rounded-[10px] bg-gradient-to-r from-[#f59e0b] to-[#f97316] px-4 py-2 text-[12px] font-semibold text-[#101318] shadow-[0_12px_20px_rgba(245,158,11,0.35)]"
        >
          Explore modules
        </a>
      </div>
    </div>
  </footer>
</div>
