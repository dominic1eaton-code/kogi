<div
  class="relative min-h-screen w-full font-['Space_Grotesk'] text-[#e6f1f4]"
  style="
    background-color: #0b1115;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 42px 42px;
  "
>
  <div
    class="pointer-events-none fixed -left-[120px] -top-[150px] h-[500px] w-[500px]"
    style="background: radial-gradient(circle, rgba(59, 130, 246, 0.12), transparent 70%);"
  ></div>
  <div
    class="pointer-events-none fixed -bottom-[120px] -right-[120px] h-[450px] w-[450px]"
    style="background: radial-gradient(circle, rgba(16, 185, 129, 0.08), transparent 70%);"
  ></div>

  <app-navigation></app-navigation>

  <header
    class="fixed left-0 right-0 top-0 flex h-[56px] items-center gap-3 border-b border-[rgba(255,255,255,0.06)] bg-gradient-to-b from-[#0e1b21] to-[#0b1418] px-5 lg:left-[220px]"
  >
    <div class="flex items-center gap-3">
      <span class="text-[12px] font-['JetBrains_Mono'] font-bold tracking-[0.35em] text-[#10b981]">KOGI</span>
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-1 text-[11px] font-['JetBrains_Mono'] text-[#5d747c]">
          <a routerLink="/dashboard" class="text-[#8ea6ad] hover:text-[#e6f1f4]">Office</a>
          <span>/</span>
          <a routerLink="/spaces" class="text-[#e6f1f4] hover:text-white">Spaces</a>
        </div>
        <div class="text-[9px] font-['JetBrains_Mono'] text-[#5d747c]">Community &middot; rooms &middot; feeds &middot; messaging</div>
      </div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <button
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-3 py-[7px] text-[11px] font-semibold text-[#8ea6ad]"
        type="button"
      >
        Create Room
      </button>
      <button
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-3 py-[7px] text-[11px] font-semibold text-[#8ea6ad]"
        type="button"
      >
        Post Update
      </button>
      <button
        class="rounded-[8px] bg-gradient-to-br from-[#10b981] to-[#059669] px-3 py-[7px] text-[11px] font-semibold text-white"
        type="button"
      >
        New Space
      </button>
      <button
        class="rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-[12px] py-[8px] text-[12px] font-semibold text-[#e6f1f4]"
        type="button"
        (click)="logout()"
      >
        Sign out
      </button>
    </div>
  </header>

  <main class="ml-0 px-5 pb-10 pt-[76px] lg:ml-[220px]">
    <div class="mb-4 h-[2px] w-full rounded bg-gradient-to-r from-[#3b82f6] via-[#a855f7] via-[#ec4899] via-[#f97316] via-[#eab308] via-[#22c55e] to-[#06b6d4]"></div>

    <section
      class="sticky top-[76px] z-30 mb-4 flex flex-wrap items-center justify-between gap-3 rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-[40px] w-[40px] items-center justify-center rounded-[10px] bg-[rgba(59,130,246,0.16)] text-[16px] text-[#60a5fa]"
        >
          &#9671;
        </div>
        <div>
          <div class="text-[16px] font-semibold">Spaces</div>
          <div class="text-[9px] font-['JetBrains_Mono'] uppercase tracking-[0.3em] text-[#5d747c]">
            <a
              routerLink="/spaces/dashboard"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Dashboard
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/spaces"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Spaces
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/rooms"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Rooms
            </a>
            <span>&middot;</span>
            <span class="cursor-pointer transition-colors hover:text-[#e6f1f4]">Messages</span>
            <span>&middot;</span>
            <a
              routerLink="/spaces/channels"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Channels
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/feed"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Feed
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/timeline"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Timeline
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/events"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Events
            </a>
            <span>&middot;</span>
            <a
              routerLink="/spaces/network"
              routerLinkActive="text-[#10b981]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="cursor-pointer transition-colors hover:text-[#e6f1f4]"
            >
              Network
            </a>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input
          class="hidden w-[180px] rounded-[8px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-3 py-[6px] text-[11px] text-[#8ea6ad] placeholder:text-[#5d747c] md:block"
          placeholder="Search spaces..."
          type="text"
        />
        <span
          class="rounded-[6px] border border-[rgba(59,130,246,0.35)] bg-[rgba(59,130,246,0.12)] px-2 py-[4px] text-[10px] font-semibold text-[#60a5fa]"
          >COMMUNITY</span
        >
        <div
          class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-gradient-to-br from-[#f59e0b] to-[#f97316] text-[12px] font-bold text-[#0b1115]"
        >
          J
        </div>
      </div>
    </section>

    <div class="min-w-0">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
