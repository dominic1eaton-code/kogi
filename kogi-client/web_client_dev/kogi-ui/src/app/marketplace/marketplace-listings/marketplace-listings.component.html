<section class="mb-4 rounded-[12px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] p-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <div class="text-[10px] uppercase tracking-[0.3em] text-[#5d747c] font-['JetBrains_Mono']">Marketplace Listings</div>
      <div class="mt-1 text-[12px] text-[#8ea6ad]">Manage listings, view details, and monitor performance across market inventory.</div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <a
        routerLink="/marketplace/market/browse"
        class="rounded-[8px] border border-[rgba(59,130,246,0.35)] bg-[rgba(59,130,246,0.12)] px-3 py-[6px] text-[10px] font-semibold text-[#60a5fa]"
      >
        Browse Market
      </a>
      <a
        routerLink="catalog"
        class="rounded-[8px] border border-[rgba(255,255,255,0.08)] bg-[#101e24] px-3 py-[6px] text-[10px] font-semibold text-[#8ea6ad]"
      >
        Catalog
      </a>
      <button
        class="rounded-[8px] bg-gradient-to-br from-[#10b981] to-[#059669] px-3 py-[6px] text-[10px] font-semibold text-white"
        type="button"
      >
        New Listing
      </button>
    </div>
  </div>

  <div class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-5">
    <div class="rounded-[10px] border border-[rgba(16,185,129,0.35)] bg-[rgba(16,185,129,0.12)] p-3">
      <div class="text-[12px] font-semibold text-[#10b981]">284</div>
      <div class="text-[9px] text-[#5d747c]">Active Listings</div>
    </div>
    <div class="rounded-[10px] border border-[rgba(245,158,11,0.35)] bg-[rgba(245,158,11,0.12)] p-3">
      <div class="text-[12px] font-semibold text-[#f59e0b]">12</div>
      <div class="text-[9px] text-[#5d747c]">Pending Orders</div>
    </div>
    <div class="rounded-[10px] border border-[rgba(34,197,94,0.35)] bg-[rgba(34,197,94,0.12)] p-3">
      <div class="text-[12px] font-semibold text-[#22c55e]">$8.4K</div>
      <div class="text-[9px] text-[#5d747c]">Monthly Volume</div>
    </div>
    <div class="rounded-[10px] border border-[rgba(59,130,246,0.35)] bg-[rgba(59,130,246,0.12)] p-3">
      <div class="text-[12px] font-semibold text-[#60a5fa]">4.8</div>
      <div class="text-[9px] text-[#5d747c]">Avg Rating</div>
    </div>
    <div class="rounded-[10px] border border-[rgba(168,85,247,0.35)] bg-[rgba(168,85,247,0.12)] p-3">
      <div class="text-[12px] font-semibold text-[#a855f7]">94%</div>
      <div class="text-[9px] text-[#5d747c]">MatchEngine</div>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap gap-2 text-[9px] font-['JetBrains_Mono'] uppercase tracking-[0.2em] text-[#5d747c]">
    <a
      routerLink="catalog"
      routerLinkActive="text-[#10b981] border-[rgba(16,185,129,0.45)] bg-[rgba(16,185,129,0.12)]"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-[8px] border border-[rgba(255,255,255,0.08)] bg-[#101e24] px-3 py-[6px] transition-colors hover:text-[#e6f1f4]"
    >
      Listings Catalog
    </a>
    <a
      routerLink="detail"
      routerLinkActive="text-[#10b981] border-[rgba(16,185,129,0.45)] bg-[rgba(16,185,129,0.12)]"
      class="rounded-[8px] border border-[rgba(255,255,255,0.08)] bg-[#101e24] px-3 py-[6px] transition-colors hover:text-[#e6f1f4]"
    >
      Listing Detail
    </a>
    <a
      routerLink="my-listings"
      routerLinkActive="text-[#10b981] border-[rgba(16,185,129,0.45)] bg-[rgba(16,185,129,0.12)]"
      class="rounded-[8px] border border-[rgba(255,255,255,0.08)] bg-[#101e24] px-3 py-[6px] transition-colors hover:text-[#e6f1f4]"
    >
      My Listings
    </a>
  </div>
</section>

<div class="min-w-0">
  <router-outlet></router-outlet>
</div>
