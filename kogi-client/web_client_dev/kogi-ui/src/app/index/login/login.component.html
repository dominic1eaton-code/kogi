<div
  class="min-h-screen w-full grid grid-cols-2 font-['Space_Grotesk'] text-[#e8f2f4]"
  style="
    background-color: #0a1013;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 42px 42px;
  "
>
  <section
    class="relative flex flex-col justify-center p-16"
    style="
      background-color: #0f1a1f;
      background-image:
        radial-gradient(ellipse 600px 400px at 30% 20%, rgba(16, 185, 129, 0.1), transparent 70%),
        radial-gradient(ellipse 300px 300px at 70% 80%, rgba(245, 158, 11, 0.08), transparent 70%);
    "
  >
    <div class="flex items-center gap-3 mb-20">
      <div
        class="flex h-[34px] w-[34px] items-center justify-center rounded-[9px] bg-gradient-to-br from-[#10b981] to-[#059669] text-sm font-extrabold text-white shadow-[0_6px_25px_rgba(16,185,129,0.4)]"
      >
        K
      </div>
      <span class="text-sm font-semibold">kogi</span>
    </div>

    <div>
      <h1 class="text-[44px] font-extrabold leading-[1.1] tracking-[-0.5px]">
        Your independent work,
        <span class="block text-[#fbbf24]">unified</span>
      </h1>

      <p class="mt-3.5 max-w-[420px] text-[15px] leading-6 text-[#90a6ad]">
        Portfolio, marketplace, finance, governance, and AI &mdash;
        all unified in one platform for modern independent work.
      </p>
    </div>
  </section>

  <section class="flex flex-col justify-center p-12 bg-[#070d11]">
    <div class="mb-7">
      <h2 class="text-[26px] font-bold">Welcome back</h2>
      <p class="text-[13px] text-[#90a6ad]">Sign in to your Kogi account</p>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-5">
      <button
        type="button"
        class="flex items-center justify-center gap-1.5 rounded-lg border border-[rgba(255,255,255,0.07)] bg-[rgba(19,40,48,0.84)] p-2.5 text-[12px] text-[#90a6ad] transition duration-150 hover:border-[#f59e0b] hover:text-[#e8f2f4]"
      >
        <span class="text-[12px] font-semibold">G</span>
        Continue with Google
      </button>
      <button
        type="button"
        class="flex items-center justify-center gap-1.5 rounded-lg border border-[rgba(255,255,255,0.07)] bg-[rgba(19,40,48,0.84)] p-2.5 text-[12px] text-[#90a6ad] transition duration-150 hover:border-[#f59e0b] hover:text-[#e8f2f4]"
      >
        &#9670; GitHub
      </button>
    </div>

    <div class="mb-5 flex items-center gap-3 text-[12px] text-[#5c747b]">
      <span class="h-px flex-1 bg-[rgba(255,255,255,0.07)]"></span>
      or continue with email
      <span class="h-px flex-1 bg-[rgba(255,255,255,0.07)]"></span>
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-[14px]">
        <label
          class="mb-[5px] block text-[11px] font-semibold uppercase tracking-[0.5px] text-[#90a6ad]"
          for="email"
        >
          Email address
        </label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="email"
          class="w-full rounded-lg border border-[rgba(255,255,255,0.07)] bg-[rgba(12,29,35,0.66)] px-3.5 py-2.5 text-[13px] text-[#e8f2f4] outline-none transition-[border-color,box-shadow,transform] duration-150 focus:-translate-y-[1px] focus:border-[#10b981] focus:shadow-[0_0_0_3px_rgba(16,185,129,0.15)]"
        />
      </div>

      <div class="mb-[14px]">
        <div class="mb-[5px] flex items-center justify-between">
          <label
            class="block text-[11px] font-semibold uppercase tracking-[0.5px] text-[#90a6ad]"
            for="password"
          >
            Password
          </label>
          <a class="text-[12px] text-[#fbbf24]" href="#">Forgot password?</a>
        </div>
        <div class="relative">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            class="w-full rounded-lg border border-[rgba(255,255,255,0.07)] bg-[rgba(12,29,35,0.66)] px-3.5 py-2.5 pr-16 text-[13px] text-[#e8f2f4] outline-none transition-[border-color,box-shadow,transform] duration-150 placeholder:text-[#e8f2f4] placeholder:opacity-100 focus:-translate-y-[1px] focus:border-[#10b981] focus:shadow-[0_0_0_3px_rgba(16,185,129,0.15)]"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] text-[#fbbf24]"
            (click)="togglePassword()"
          >
            {{ showPassword ? 'hide' : 'show' }}
          </button>
        </div>
      </div>

      <label class="mb-[18px] flex items-center gap-2 text-[13px] text-[#90a6ad]">
        <input
          type="checkbox"
          name="remember"
          [(ngModel)]="remember"
          class="h-4 w-4 accent-[#10b981]"
        />
        <span>Keep me signed in for 30 days</span>
      </label>

      <button
        type="submit"
        class="w-full rounded-[10px] bg-gradient-to-br from-[#10b981] to-[#059669] py-[13px] text-[14px] font-semibold text-white transition duration-200 hover:-translate-y-[1px] hover:shadow-[0_10px_30px_rgba(16,185,129,0.35)]"
      >
        Sign in
      </button>
    </form>

    <p class="mt-[14px] text-center text-[12px] text-[#90a6ad]">
      Don't have an account?
      <a class="text-[#fbbf24]" routerLink="/registration">Create one free</a>
    </p>
  </section>
</div>
