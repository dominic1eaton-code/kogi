<div
  class="mb-4 flex items-center gap-1 overflow-x-auto rounded-[10px] border border-[rgba(255,255,255,0.06)] bg-[#0f1f26] px-2 py-2 text-[10px] font-['JetBrains_Mono']"
>
  <a
    routerLink="overview"
    routerLinkActive="border-[#10b981] text-[#10b981]"
    [routerLinkActiveOptions]="{ exact: true }"
    class="whitespace-nowrap border-b-2 border-transparent px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]"
  >
    OVERVIEW
  </a>
  <a
    routerLink="taxes"
    routerLinkActive="border-[#10b981] text-[#10b981]"
    class="whitespace-nowrap border-b-2 border-transparent px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]"
  >
    TAXES
  </a>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">CREDIT</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">DEBT</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">EQUITY</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">SECURITIES</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">PORTABLE BENEFITS</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">GRANTS &amp; MICROFINANCING</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">GROUP ECONOMICS</button>
  <button class="whitespace-nowrap px-3 py-1 text-[#5d747c] hover:text-[#e6f1f4]" type="button">EQUITY CROWDFUNDING</button>
</div>

<div class="min-w-0">
  <router-outlet></router-outlet>
</div>
