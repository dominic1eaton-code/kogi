[package]
name = "hypergrid"
version = "1.0.0"
edition = "2021"
authors = ["Kogi Platform Team"]
description = "Hypergrid — N-Dimensional Distributed Spreadsheet System (NDSS)"
license = "Apache-2.0"
repository = "https://github.com/kogi-platform/hypergrid"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
