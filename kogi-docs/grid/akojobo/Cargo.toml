[package]
name = "kogi-portfolio"
version = "2.1.0"
edition = "2021"
authors = ["Kogi Platform Team"]
description = "Kogi Platform — Portfolio System v2.1 (built on Hypergrid NDSS)"
license = "Proprietary"

[dependencies]
hypergrid   = { path = "../hypergrid" }
uuid        = { version = "=1.6.1", features = ["v4", "serde"] }
serde       = { version = "=1.0.193", features = ["derive"] }
serde_json  = "=1.0.108"
chrono      = { version = "=0.4.31", features = ["serde"] }
thiserror   = "=1.0.51"

[dev-dependencies]
pretty_assertions = "=1.4.0"
