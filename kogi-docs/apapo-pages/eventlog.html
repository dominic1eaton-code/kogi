<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apapo · Event Log</title>
<link rel="stylesheet" href="hg-shared.css">
<style>
.ev-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.08s}
.ev-row:hover{background:var(--bg3)}
.ev-row.selected{background:var(--bg4)}
.ev-bullet{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.ev-kind{font-family:var(--mono);font-size:9px;color:var(--cyan);width:180px;flex-shrink:0}
.ev-entity{font-family:var(--mono);font-size:9px;color:var(--text2);flex:1}
.ev-actor{font-family:var(--mono);font-size:8px;color:var(--text3);width:100px;flex-shrink:0}
.ev-ts{font-family:var(--mono);font-size:8px;color:var(--text3);width:70px;flex-shrink:0;text-align:right}
.ev-grid{font-family:var(--mono);font-size:7px;padding:1px 5px;border-radius:2px;border:1px solid;flex-shrink:0}
</style>
</head>
<body>
<nav class="topnav">
  <span class="topnav-logo">APAPO</span>
  <div class="topnav-sep"></div>
  <div class="topnav-breadcrumb"><a href="index.html">Dashboard</a><span class="sep">›</span><span class="cur">Event Log</span></div>
  <div class="topnav-spacer"></div>
  <div class="topnav-actions">
    <button class="btn btn-ghost btn-sm" onclick="showToast('Exporting EventLog as NDJSON…')">⤓ Export</button>
    <button class="btn btn-primary btn-sm" onclick="toggleLive()">◉ Live</button>
  </div>
</nav>
<nav class="iconav" id="hg-iconav"></nav>

<div class="hg-main no-subnav" style="left:var(--nav-w)">
  <div class="hg-toolbar">
    <span class="hg-toolbar-title">EventLog</span>
    <span class="hg-toolbar-sub">Append-only immutable audit trail · All grids · All domain systems</span>
    <div class="hg-toolbar-sep"></div>
    <div class="pill-group" id="ev-filter-pills">
      <button class="pill active" onclick="filterEvents('all',this)">All</button>
      <button class="pill" onclick="filterEvents('Component',this)">Component</button>
      <button class="pill" onclick="filterEvents('Graph',this)">Graph</button>
      <button class="pill" onclick="filterEvents('Governance',this)">Governance</button>
      <button class="pill" onclick="filterEvents('AI',this)">AI</button>
      <button class="pill" onclick="filterEvents('Crdt',this)">CRDT</button>
      <button class="pill" onclick="filterEvents('Federation',this)">Federation</button>
    </div>
    <div class="ml-auto">
      <select class="form-select" style="width:180px;font-size:9px;padding:3px 8px" onchange="filterByGrid(this.value)">
        <option value="all">All Grids</option>
        <option value="grid-kogi">Kogi Grid</option>
        <option value="grid-ume">Ume Grid</option>
        <option value="grid-qala">Qala Grid</option>
      </select>
    </div>
  </div>
  <div class="hg-split">
    <div style="flex:1;overflow:auto;padding:14px">
      <div class="stat-grid grid-4 mb-3" id="ev-stats"></div>
      <div id="ev-list"></div>
    </div>
    <div class="hg-panel-right">
      <div class="panel-hdr"><span class="panel-hdr-title" id="ev-detail-title">Event Detail</span></div>
      <div style="flex:1;overflow-y:auto" id="ev-detail-body">
        <div style="padding:20px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:9px">
          <div style="font-size:20px;opacity:0.25;margin-bottom:8px">↯</div>Select an event
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="hg-toast"></div>
<script src="hg-nav.js"></script>
<script src="hg-data.js"></script>
<script>
renderNav('eventlog');
const { events, grids } = HGData;

// Expand event list with more entries
const allEvents = [
  ...events,
  {id:'ev11',kind:'ComponentCreated',entity_id:'node-health-plan',actor:'@alice-dev',ts:'2026-03-20T15:00:00Z',grid:'grid-kogi',payload:{name:'HSA Benefit Account',kind:'BenefitAccount'}},
  {id:'ev12',kind:'EdgeAdded',entity_id:'e-new',actor:'@carol',ts:'2026-03-20T15:05:00Z',grid:'grid-kogi',payload:{edge_type:'Dependency',source:'Brand Identity',target:'Design System'}},
  {id:'ev13',kind:'PolicyDenied',entity_id:'budget-cap',actor:'@dave',ts:'2026-03-20T15:10:00Z',grid:'grid-ume',payload:{policy:'budget-cap-policy',reason:'Exceeds quarterly cap'}},
  {id:'ev14',kind:'ApprovalRequested',entity_id:'ccr-004',actor:'ComplianceEng',ts:'2026-03-20T15:15:00Z',grid:'grid-qala',payload:{reason:'FDA compliance change requires governance vote'}},
  {id:'ev15',kind:'CrdtMergeApplied',entity_id:'grid-ume',actor:'federation',ts:'2026-03-20T15:20:00Z',grid:'grid-ume',payload:{ops:8,merged_from:'eu-west:ume-02'}},
  {id:'ev16',kind:'SnapshotSaved',entity_id:'grid-kogi',actor:'system',ts:'2026-03-20T15:30:00Z',grid:'grid-kogi',payload:{label:'15:30-auto'}},
  {id:'ev17',kind:'ComponentStatusChanged',entity_id:'node-finance',actor:'@alice-dev',ts:'2026-03-20T15:35:00Z',grid:'grid-kogi',payload:{from:'Paused',to:'Active'}},
  {id:'ev18',kind:'UserAdded',entity_id:'node-design-team',actor:'@alice-dev',ts:'2026-03-20T15:40:00Z',grid:'grid-kogi',payload:{user:'@carol',tier:'Editor'}},
  {id:'ev19',kind:'ResourceAllocated',entity_id:'node-mobile',actor:'@alice-dev',ts:'2026-03-20T15:45:00Z',grid:'grid-kogi',payload:{kind:'Budget',amount:5000,currency:'USD'}},
  {id:'ev20',kind:'FederationSyncCompleted',entity_id:'grid-qala',actor:'federation',ts:'2026-03-20T15:50:00Z',grid:'grid-qala',payload:{peer:'us-east:qala-02',ops_applied:0,status:'reconnected'}},
];

const EV_COLORS = {
  ComponentCreated:'#3cb878',ComponentUpdated:'#3d84e8',ComponentRemoved:'#e8526a',
  ComponentStatusChanged:'#e8a832',CrdtMergeApplied:'#2dd4bf',EdgeAdded:'#3d84e8',
  EdgeRemoved:'#e8526a',AiComputationCompleted:'#e8a832',SnapshotSaved:'#8b5cf6',
  FederationSyncCompleted:'#00d8b0',PolicyDenied:'#e8526a',ApprovalRequested:'#8b5cf6',
  ResourceAllocated:'#e87032',UserAdded:'#3cb878',ActionPerformed:'#3d84e8',
};

const EV_CATEGORY = {
  ComponentCreated:'Component',ComponentUpdated:'Component',ComponentRemoved:'Component',ComponentStatusChanged:'Component',
  EdgeAdded:'Graph',EdgeRemoved:'Graph',CrdtMergeApplied:'Crdt',
  AiComputationCompleted:'AI',SnapshotSaved:'Governance',FederationSyncCompleted:'Federation',
  PolicyDenied:'Governance',ApprovalRequested:'Governance',ResourceAllocated:'Component',UserAdded:'Component',
};

const GRID_COLORS = {'grid-kogi':'var(--kogi)','grid-ume':'var(--ume)','grid-qala':'var(--qala)'};

let evState = { filter:'all', grid:'all', selected:null };

function getVisible() {
  return allEvents.filter(ev => {
    if (evState.grid!=='all' && ev.grid!==evState.grid) return false;
    if (evState.filter!=='all') {
      const cat = EV_CATEGORY[ev.kind]||'Other';
      if (cat!==evState.filter) return false;
    }
    return true;
  });
}

function renderEventLog() {
  const vis = getVisible();
  // Stats
  const kinds = {};
  vis.forEach(ev=>kinds[ev.kind]=(kinds[ev.kind]||0)+1);
  document.getElementById('ev-stats').innerHTML = [
    ['Total Events',allEvents.length,'var(--cyan)'],
    ['Showing',vis.length,'var(--text2)'],
    ['Grids',new Set(allEvents.map(e=>e.grid)).size,'var(--violet)'],
    ['Event Types',Object.keys(kinds).length,'var(--gold)'],
  ].map(([l,v,c])=>`<div class="stat-cell"><div class="stat-label">${l}</div><div class="stat-val" style="color:${c};font-size:14px">${v}</div></div>`).join('');

  document.getElementById('ev-list').innerHTML = `
    <div style="display:grid;grid-template-columns:180px 1fr 100px 70px 70px;gap:0;font-family:var(--mono);font-size:7px;color:var(--text3);padding:4px 0 4px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.1em">
      <span>Event Kind</span><span>Entity</span><span>Actor</span><span>Grid</span><span style="text-align:right">Time</span>
    </div>
    ${vis.map(ev => {
      const color = EV_COLORS[ev.kind]||'#888';
      const gridColor = GRID_COLORS[ev.grid]||'var(--text3)';
      const isSel = evState.selected===ev.id;
      return `<div class="ev-row${isSel?' selected':''}" onclick="selectEvent('${ev.id}')">
        <div class="ev-bullet" style="background:${color}"></div>
        <span class="ev-kind" style="color:${color}">${ev.kind}</span>
        <span class="ev-entity">${ev.entity_id.replace('node-','').replace('cube-','')}</span>
        <span class="ev-actor">${ev.actor}</span>
        <span class="ev-grid" style="border-color:${gridColor}40;color:${gridColor}">${ev.grid.replace('grid-','')}</span>
        <span class="ev-ts">${ev.ts.slice(11,19)}</span>
      </div>`;
    }).join('')}`;
}

function selectEvent(id) {
  evState.selected = evState.selected===id?null:id;
  const ev = allEvents.find(e=>e.id===id);
  renderEventDetail(ev);
  renderEventLog();
}

function renderEventDetail(ev) {
  const title = document.getElementById('ev-detail-title');
  const body = document.getElementById('ev-detail-body');
  if (!ev) { title.textContent='Event Detail'; body.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:9px"><div style="font-size:20px;opacity:0.25;margin-bottom:8px">↯</div>Select an event</div>'; return; }
  const color = EV_COLORS[ev.kind]||'#888';
  const gridColor = GRID_COLORS[ev.grid]||'var(--text3)';
  title.textContent = ev.kind;
  body.innerHTML=`
    <div style="height:3px;background:${color}"></div>
    <div style="padding:10px 12px">
      <div class="section-label">Event</div>
      <div class="kv"><span class="kv-key">Kind</span><span class="kv-val" style="color:${color}">${ev.kind}</span></div>
      <div class="kv"><span class="kv-key">Event ID</span><span class="kv-val" style="font-size:8px">${ev.id}</span></div>
      <div class="kv"><span class="kv-key">Entity</span><span class="kv-val">${ev.entity_id}</span></div>
      <div class="kv"><span class="kv-key">Actor</span><span class="kv-val">${ev.actor}</span></div>
      <div class="kv"><span class="kv-key">Grid</span><span class="kv-val" style="color:${gridColor}">${ev.grid}</span></div>
      <div class="kv"><span class="kv-key">Timestamp</span><span class="kv-val">${fmtDateFull(ev.ts)}</span></div>
      <div class="kv"><span class="kv-key">Category</span><span class="kv-val">${EV_CATEGORY[ev.kind]||'Other'}</span></div>
      <div class="section-label mt-3">Payload</div>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:8px;font-family:var(--mono);font-size:9px;color:var(--text2);white-space:pre;overflow-x:auto;margin-bottom:10px">${JSON.stringify(ev.payload,null,2)}</div>
      <div class="section-label">EventLog Model</div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.7;margin-bottom:10px">
        Append-only VecDeque&lt;PortfolioEvent&gt;<br>
        Bounded at 10,000 events (FIFO eviction)<br>
        Flushed to Data Lake before eviction<br>
        Immutable — never mutated, only read
      </div>
      <div class="section-label">Actions</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="showToast('Replaying state from event ${ev.id}…')">⟳ Replay to This Point</button>
        <button class="btn btn-ghost btn-sm" onclick="copyText(JSON.stringify(${JSON.stringify(ev)},null,2));showToast('Event copied')">⎘ Copy JSON</button>
      </div>
    </div>`;
}

function filterEvents(f, el) { evState.filter=f; document.querySelectorAll('#ev-filter-pills .pill').forEach(p=>p.classList.remove('active')); el.classList.add('active'); renderEventLog(); }
function filterByGrid(g) { evState.grid=g; renderEventLog(); }

let liveEv = null;
function toggleLive() {
  if (liveEv) { clearInterval(liveEv); liveEv=null; showToast('Live paused'); }
  else { liveEv=setInterval(()=>{ showToast('New event: ComponentUpdated'); },5000); showToast('Live EventLog active'); }
}

renderEventLog();
</script>
</body>
</html>
