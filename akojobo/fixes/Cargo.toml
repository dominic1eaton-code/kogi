[package]
name = "kogi-portfolio"
version = "2.1.0"
edition = "2021"
authors = ["Kogi Platform Team"]
description = "Kogi Platform — Portfolio System (portfolio_system.rs v2.1)"
license = "Proprietary"
repository = "https://github.com/kogi-platform/kogi-os"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }

[dev-dependencies]
pretty_assertions = "1"
